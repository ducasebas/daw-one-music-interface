<!doctype html><html lang="en" translate="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate"><link rel="stylesheet" href="/appliance.css"><script src="/appliance.js"></script><title>DAW TuneBox</title>
<style>html{color-scheme:dark;background:#101416;color:#f1eee6;font:20px system-ui}body{height:100vh;margin:0;display:grid;place-items:center}main{width:min(900px,85vw)}small{letter-spacing:.2em;color:#c5a466}h1{font-weight:400}progress{width:100%;height:12px;accent-color:#c5a466}p{color:#b8bab8}button{padding:14px 25px;background:transparent;color:inherit;border:1px solid #c5a466;border-radius:30px}#hint{font-size:15px}@media(prefers-reduced-motion:no-preference){progress:indeterminate{opacity:.65;animation:b 2s infinite alternate}@keyframes b{to{opacity:1}}}html[data-kiosk="true"] *{cursor:none!important}</style>
<main><small>DAW TUNEBOX</small><h1 id="phase">Reconnecting…</h1><progress aria-label="Update progress"></progress><p id="detail">Your music configuration and settings are preserved.</p><p id="hint" role="status">This screen stays available while the app restarts.</p><button id="retry" hidden>Try again</button></main>
<script>
requestAnimationFrame(()=>requestAnimationFrame(()=>fetch('/frame-ready',{method:'POST',headers:{'X-TuneBox-Frame':'__TUNEBOX_FRAME_TOKEN__'}}).catch(()=>{})));
const labels={'downloading':'Downloading update','verifying':'Verifying signature','preparing':'Preparing update','installing':'Installing update','restarting':'Starting TuneBox','checking-health':'Checking the new version','rolling-back':'Restoring previous version','error':'Update incomplete','rolled-back':'Previous version restored','installed':'Update complete'};
const kioskQuery=new URLSearchParams(location.search);if(kioskQuery.get('display')==='dsi-production')document.documentElement.dataset.kiosk='true';
const active=['downloading','verifying','preparing','installing','restarting','checking-health','rolling-back'];const q=new URLSearchParams(location.search);const display=q.get('display')==='dsi-production'?'dsi-production':'hdmi-development';const target='http://127.0.0.1:3001/?gui=2&screen=1&display='+display+(q.get('profile')==='pi3'?'&profile=pi3':'')+'&panel='+(q.get('panel')==='wall-16-10'?'wall-16-10':'legacy-wide');
async function poll(){try{const r=await fetch('/status',{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json();document.querySelector('#phase').textContent=labels[s.status]||'Starting TuneBox';const bar=document.querySelector('progress');if(typeof s.percent==='number')bar.value=s.percent/100;else bar.removeAttribute('value');document.querySelector('#detail').textContent=s.commit?'Version '+s.commit.slice(0,8)+' · settings preserved':'Settings preserved';if(s.appReady&&!active.includes(s.status))location.replace(target);else document.querySelector('#retry').hidden=!['error','rolled-back'].includes(s.status);}catch{document.querySelector('#phase').textContent='Waiting for the update service…';}}
document.querySelector('#retry').onclick=()=>location.assign(target);poll();setInterval(poll,1000);
</script></html>
