<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TuneBox · Software-update</title>
<style>html{color-scheme:dark;background:#101416;color:#f1eee6;font:20px system-ui}body{height:100vh;margin:0;display:grid;place-items:center}main{width:min(900px,85vw)}small{letter-spacing:.2em;color:#c5a466}h1{font-weight:400}progress{width:100%;height:12px;accent-color:#c5a466}p{color:#b8bab8}button{padding:14px 25px;background:transparent;color:inherit;border:1px solid #c5a466;border-radius:30px}#hint{font-size:15px}@media(prefers-reduced-motion:no-preference){progress:indeterminate{opacity:.65;animation:b 2s infinite alternate}@keyframes b{to{opacity:1}}}</style>
<main><small>DAW TUNEBOX</small><h1 id="phase">Verbinding herstellen…</h1><progress aria-label="Updatevoortgang"></progress><p id="detail">Je muziekconfiguratie en instellingen blijven behouden.</p><p id="hint" role="status">Dit scherm blijft beschikbaar terwijl de app opnieuw start.</p><button id="retry" hidden>Opnieuw proberen</button></main>
<script>
const labels={'downloading':'Update downloaden','verifying':'Handtekening controleren','preparing':'Update voorbereiden','installing':'Update installeren','restarting':'TuneBox starten','checking-health':'Nieuwe versie controleren','rolling-back':'Vorige versie herstellen','error':'Update niet voltooid','rolled-back':'Vorige versie hersteld','installed':'Update voltooid'};
const active=['downloading','verifying','preparing','installing','restarting','checking-health','rolling-back'];const q=new URLSearchParams(location.search);const display=q.get('display')==='dsi-production'?'dsi-production':'hdmi-development';const target='http://127.0.0.1:3001/?gui=2&screen=1&display='+display+(q.get('profile')==='pi3'?'&profile=pi3':'');
async function poll(){try{const r=await fetch('/status',{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json();document.querySelector('#phase').textContent=labels[s.status]||'TuneBox starten';const bar=document.querySelector('progress');if(typeof s.percent==='number')bar.value=s.percent/100;else bar.removeAttribute('value');document.querySelector('#detail').textContent=s.commit?'Versie '+s.commit.slice(0,8)+' · instellingen blijven behouden':'Instellingen blijven behouden';if(s.appReady&&!active.includes(s.status))location.replace(target);else document.querySelector('#retry').hidden=!['error','rolled-back'].includes(s.status);}catch{document.querySelector('#phase').textContent='Wachten op de updateservice…';}}
document.querySelector('#retry').onclick=()=>location.assign(target);poll();setInterval(poll,1000);
</script></html>
