<desc id="desc">Pasmodel van 176 bij 110 bij 45 millimeter. Bestaand schermglas, houten mantel en Pi en HAT naast elkaar. Rechthoeken zijn omhullenden, geen snijprofielen. Geen boormal.</desc>
