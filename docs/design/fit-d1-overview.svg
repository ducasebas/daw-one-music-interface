<text x="15" y="170" font-size="4" >MATERIAALOPBOUW</text>
<text x="15" y="177" font-size="3.2" >Zichtzijde: origineel zwart schermglas. Mantel: berkenmultiplex + walnootfineer.</text>
<text x="15" y="183" font-size="3.2" >Nominale kernwand achter: 4 mm; afwerking: 0,8 mm gereserveerd.</text>
<text x="15" y="189" font-size="3.2" >Achterplaat: 3 mm aluminium. MDF kan dienen voor het pasmodel.</text>
<text x="15" y="195" font-size="3.2" >Houten kant naast glas: 2,91 mm; boven/onder: 2,90 mm.</text>
<text x="15" y="201" font-size="3.2" >Fineerhoeken en bevestiging volgen na materiaalproef; geen metalen voorrand.</text>
<text x="229" y="170" font-size="4" >LEGENDA / HOOGTE</text>
<rect x="229" y="175" width="5" height="4" fill="#e0eadb" stroke="#47505a" stroke-width=".35" /><text x="237" y="178.5" font-size="2.8" >Gebaseerd op fabrikant-STEP; getoond als omhullende</text>
<rect x="229" y="182" width="5" height="4" fill="#dae4ed" stroke="#47505a" stroke-width=".35" /><text x="237" y="185.5" font-size="2.8" >Pi: conservatieve omhullende, geen fabrikant-STEP</text>
<rect x="229" y="189" width="5" height="4" fill="#f2dfbc" stroke="#47505a" stroke-width=".35" /><text x="237" y="192.5" font-size="2.8" >Reservering; definitieve componentkeuze nog open</text>
<text x="229" y="201" font-size="2.9" >z = diepte vanaf de voorzijde (mm). In de projectie kunnen</text>
<text x="229" y="207" font-size="2.9" >delen overlappen die op verschillende dieptes liggen.</text>
<text x="15" y="216" font-size="3.6" >DIEPTEKETEN — omhullende, geen lokale doorsnede</text>
<rect x="15" y="222" width="176" height="45" fill="#f9f7f3" stroke="#47505a" stroke-width=".35" />
<rect x="15" y="264" width="176" height="3" fill="#c6cbd0" stroke="#47505a" stroke-width=".35" />
<text x="103" y="235" font-size="3.2" text-anchor="middle">Schermmodule: max. 15,30 mm vanaf het voorvlak</text>
<text x="103" y="243" font-size="3.2" text-anchor="middle">Elektronica en gereserveerde stekkerruimte daarachter</text>
<text x="103" y="251" font-size="3.2" text-anchor="middle">Volledige kabelboom en bevestiging nog te controleren</text>
<text x="103" y="261" font-size="3" text-anchor="middle">Achterplaat z42–45</text>
<path d="M195 222h6M195 267h6M199 222v45" fill="none" stroke="#17202a" stroke-width=".3"/>
<text x="203" y="246" font-size="3" transform="rotate(-90 203 246)" text-anchor="middle">45 mm</text>
<text x="229" y="219" font-size="4" >NOMINALE CAD-CONTROLE</text>
<text x="229" y="227" font-size="3.2" >31 objecten / reserveringen · 66 solid-intersecties</text>
<text x="229" y="234" font-size="3.6" >0 onverwachte volume-overlappingen</text>
<text x="229" y="242" font-size="2.8" >Geen bewijs van volledige kabelroute, fabricagetoleranties,</text>
<text x="229" y="248" font-size="2.8" >warmteafvoer, ontvangst, sterkte of geleverde revisies.</text>
<text x="229" y="256" font-size="2.8" >Volgende stap: bevestiging + kabelboom → fysieke pasproef.</text>
<text x="229" y="263" font-size="2.8" >Knop steekt nominaal 1,5 mm boven de kast uit.</text>
<text x="15" y="281" font-size="3" >Bronnen, afwijkingen en beperkingen: fit-d1-status.md · detail-CAD/PDF-publicatie staat nog open.</text>
<text x="15" y="288" font-size="3" >Wandophanging en wandafstand zijn niet in 176 × 110 × 45 mm opgenomen. Alle maten in mm.</text>
