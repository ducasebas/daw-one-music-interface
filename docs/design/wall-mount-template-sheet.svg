<text x="246" y="90" font-family="DejaVu Sans, sans-serif" font-size="3.0" font-weight="400" fill="#53676e" text-anchor="start">MONTEREN VANUIT DEZELFDE ZIJDE</text>
<text x="246" y="96" font-family="DejaVu Sans, sans-serif" font-size="3.0" font-weight="400" fill="#53676e" text-anchor="start">ALS DE TEKENING OP BLAD 1.</text>
<text x="246" y="102" font-family="DejaVu Sans, sans-serif" font-size="3.0" font-weight="400" fill="#53676e" text-anchor="start"></text>
<text x="246" y="108" font-family="DejaVu Sans, sans-serif" font-size="3.0" font-weight="400" fill="#53676e" text-anchor="start">Dit sjabloon geeft harten, geen tap- of boormaten.</text>
<text x="246" y="114" font-family="DejaVu Sans, sans-serif" font-size="3.0" font-weight="400" fill="#53676e" text-anchor="start">Controleer de geleverde print tegen het sjabloon.</text>
<text x="246" y="120" font-family="DejaVu Sans, sans-serif" font-size="3.0" font-weight="400" fill="#53676e" text-anchor="start">Rev F is publiek; F1 kan afwijken.</text>
<text x="246" y="126" font-family="DejaVu Sans, sans-serif" font-size="3.0" font-weight="400" fill="#53676e" text-anchor="start">Printen, stekkers en scherm moeten vrij liggen.</text>
<text x="246" y="132" font-family="DejaVu Sans, sans-serif" font-size="3.0" font-weight="400" fill="#53676e" text-anchor="start"></text>
<text x="246" y="138" font-family="DejaVu Sans, sans-serif" font-size="3.0" font-weight="400" fill="#53676e" text-anchor="start">Sensoren komen in losse nylon houdertjes.</text>
<text x="246" y="144" font-family="DejaVu Sans, sans-serif" font-size="3.0" font-weight="400" fill="#53676e" text-anchor="start">Carrier en radar zijn gereserveerde zones.</text>
<text x="246" y="150" font-family="DejaVu Sans, sans-serif" font-size="3.0" font-weight="400" fill="#53676e" text-anchor="start">Schermgaten zijn bewust niet overgenomen</text>
<text x="246" y="156" font-family="DejaVu Sans, sans-serif" font-size="3.0" font-weight="400" fill="#53676e" text-anchor="start">naar de achterplaat; het LCD heeft eigen montage.</text>
<text x="246" y="162" font-family="DejaVu Sans, sans-serif" font-size="3.0" font-weight="400" fill="#53676e" text-anchor="start"></text>
<text x="246" y="168" font-family="DejaVu Sans, sans-serif" font-size="3.0" font-weight="400" fill="#53676e" text-anchor="start">Geef CNC pas vrij na de complete pasproef.</text>
