<text x="16" y="273" font-family="DejaVu Sans, sans-serif" font-size="2.6" font-weight="400" fill="#53676e" text-anchor="start">Symbolen zijn reserveringen; geen gefingeerde boorgaten voor onbekende paneelklemmen.</text>
<text x="301" y="42" font-family="DejaVu Sans, sans-serif" font-size="3.2" font-weight="700" fill="#23343a" text-anchor="start">MAATBASIS</text>
<text x="301" y="49.0" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">Kast: 190 × 124 × 50.</text>
<text x="301" y="53.69999999999999" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">Achterplaat: aluminium 3.</text>
<text x="301" y="58.400000000000006" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">Walnoot zijwand: 5 nominale dikte.</text>
<text x="301" y="63.099999999999994" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">Wandafstand: 5 gereserveerd.</text>
<text x="301" y="67.80000000000001" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">55 wandprojectie blijft een doelmaat.</text>
<text x="301" y="81" font-family="DejaVu Sans, sans-serif" font-size="3.2" font-weight="700" fill="#23343a" text-anchor="start">MONTAGE</text>
<text x="301" y="88.0" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">Pi + HAT: elk 2 diagonale schroeven.</text>
<text x="301" y="92.69999999999999" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">Daarnaast elk 2 passieve steunvoetjes.</text>
<text x="301" y="97.4" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">Geen gedeelde bouten door het LCD.</text>
<text x="301" y="102.1" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">Montagevoeten: geschroefd heeft voorkeur.</text>
<text x="301" y="106.80000000000001" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">Gelijmde voeten alleen na lijmproef.</text>
<text x="301" y="120" font-family="DejaVu Sans, sans-serif" font-size="3.2" font-weight="700" fill="#23343a" text-anchor="start">WARMTE</text>
<text x="301" y="127.0" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">Pi-SoC via passende metalen brug</text>
<text x="301" y="131.7" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">en isolerend thermisch raakvlak naar alu.</text>
<text x="301" y="136.4" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">HAT via daarvoor geschikte PCB-zone;</text>
<text x="301" y="141.1" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">geen willekeurige druk op componenten.</text>
<text x="301" y="145.8" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">Thermische delen zijn geen printlijm.</text>
<text x="301" y="159" font-family="DejaVu Sans, sans-serif" font-size="3.2" font-weight="700" fill="#23343a" text-anchor="start">SENSOREN EN RADIO</text>
<text x="301" y="166.0" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">PCT op nylon; los van hete achterplaat.</text>
<text x="301" y="170.7" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">TSL via lichtgeleider naar boven.</text>
<text x="301" y="175.4" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">Radar bij een niet-metalen bodemvenster.</text>
<text x="301" y="180.1" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">Wi-Fi en radar in gesloten kast testen.</text>
<text x="301" y="184.8" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">Kabels krijgen trekontlasting.</text>
<text x="301" y="198" font-family="DejaVu Sans, sans-serif" font-size="3.2" font-weight="700" fill="#23343a" text-anchor="start">GECONTROLEERD</text>
<text x="301" y="205.0" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">Openbare fabrikant-CAD gebruikt.</text>
<text x="301" y="209.7" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">Geen overlap van PCB-reserveringen.</text>
<text x="301" y="214.4" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">Kleinste tussenruimte: circa 4,00 mm.</text>
<text x="301" y="219.1" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">Stekkers en kabels nog passen in 3D.</text>
<text x="301" y="223.8" font-family="DejaVu Sans, sans-serif" font-size="2.85" font-weight="400" fill="#53676e" text-anchor="start">* Warmtebrugzone is indicatief.</text>
<rect x="301" y="241" width="105" height="28" rx="2" fill="#fcf3e6" stroke="#b27735" stroke-width="0.25"/>
<text x="305" y="250" font-family="DejaVu Sans, sans-serif" font-size="2.7" font-weight="400" fill="#895b26" text-anchor="start">BRONMATEN ≠ BEWEZEN MINIMUMDIKTE.</text>
<text x="305" y="255" font-family="DejaVu Sans, sans-serif" font-size="2.7" font-weight="400" fill="#895b26" text-anchor="start">Plaatsing en hoofdgatpatronen zijn vastgelegd;</text>
<text x="305" y="260" font-family="DejaVu Sans, sans-serif" font-size="2.7" font-weight="400" fill="#895b26" text-anchor="start">pasproef, warmte en I/O bepalen vrijgave.</text>
