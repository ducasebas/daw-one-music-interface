<text x="121.5" y="151.4" font-family="DejaVu Sans, sans-serif" font-size="2.8" font-weight="400" fill="#53676e" text-anchor="middle">45 mm kastdiepte, vanaf glasvoorzijde</text>
<text x="253" y="72" font-family="DejaVu Sans, sans-serif" font-size="3" font-weight="400" fill="#53676e" text-anchor="start">SCHERM: GEEN DIKTESCHATTING</text>
<text x="253" y="78" font-family="DejaVu Sans, sans-serif" font-size="3" font-weight="400" fill="#53676e" text-anchor="start">STEP-omhullende: 15,30 mm.</text>
<text x="253" y="84" font-family="DejaVu Sans, sans-serif" font-size="3" font-weight="400" fill="#53676e" text-anchor="start">Incl. gemodelleerde connectoren en bussen.</text>
<text x="253" y="90" font-family="DejaVu Sans, sans-serif" font-size="3" font-weight="400" fill="#53676e" text-anchor="start">Pluggen zijn afzonderlijk gereserveerd.</text>
<text x="253" y="112" font-family="DejaVu Sans, sans-serif" font-size="3" font-weight="400" fill="#53676e" text-anchor="start">HOUTEN SPONNING</text>
<text x="253" y="118" font-family="DejaVu Sans, sans-serif" font-size="3" font-weight="400" fill="#53676e" text-anchor="start">0,8 mm afwerkingsruimte.</text>
<text x="253" y="124" font-family="DejaVu Sans, sans-serif" font-size="3" font-weight="400" fill="#53676e" text-anchor="start">4 mm nominale kernwand achterin.</text>
<text x="253" y="130" font-family="DejaVu Sans, sans-serif" font-size="3" font-weight="400" fill="#53676e" text-anchor="start">Voorin vrijgefreesd rond schermmodule.</text>
<text x="253" y="136" font-family="DejaVu Sans, sans-serif" font-size="3" font-weight="400" fill="#53676e" text-anchor="start">Circa 2,9 mm zichtbare houten kant.</text>
<text x="18" y="182" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#23343a" text-anchor="start">PLAATSELIJK GEBRUIK VAN DE DIEPTE</text>
<text x="18" y="193" font-family="DejaVu Sans, sans-serif" font-size="3" font-weight="400" fill="#53676e" text-anchor="start">WAGO-reserves: Z 9–18 vóór de Pi; daar is het scherm ondieper dan op zijn hoogste punten.</text>
<text x="18" y="200" font-family="DejaVu Sans, sans-serif" font-size="3" font-weight="400" fill="#53676e" text-anchor="start">Zekeringhouder: Z 10–23 vóór de bovenste carrier; de werkelijke houder moet binnen zijn reservering vallen.</text>
<text x="18" y="207" font-family="DejaVu Sans, sans-serif" font-size="3" font-weight="400" fill="#53676e" text-anchor="start">Temperatuur-PCB: Z 12–29,78. Licht-PCB: Z 22–39,78. Zo kruisen de QT-pluggen elkaar niet.</text>
<text x="18" y="214" font-family="DejaVu Sans, sans-serif" font-size="3" font-weight="400" fill="#53676e" text-anchor="start">Routinglaag: Z 16,5–18,5, alleen waar de modellen die ruimte vrijlaten.</text>
<text x="18" y="221" font-family="DejaVu Sans, sans-serif" font-size="3" font-weight="400" fill="#53676e" text-anchor="start">Dat is een vrije laag voor ontwerp, geen bewijs van de volledige kabelroute of toegestane FPC-buigradius.</text>
<text x="18" y="243" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="700" fill="#23343a" text-anchor="start">VOLGENDE FASE: bevestiging, montagevolgorde en echte kabels; daarna pas afmetingen vrijgeven.</text>
</svg>
