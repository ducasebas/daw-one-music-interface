<text x="145.6" y="44.650000000000006" font-family="DejaVu Sans, sans-serif" font-size="2.8" font-weight="400" fill="#53676e" text-anchor="middle">176  kastbreedte van pasmodel</text>
<line x1="22.219499999999996" y1="224.6" x2="268.9805" y2="224.6" stroke="#53676e" stroke-width="0.2"/>
<line x1="21.219499999999996" y1="226.0" x2="23.219499999999996" y2="223.2" stroke="#53676e" stroke-width="0.25"/>
<line x1="267.9805" y1="226.0" x2="269.9805" y2="223.2" stroke="#53676e" stroke-width="0.25"/>
<text x="145.6" y="223.0" font-family="DejaVu Sans, sans-serif" font-size="2.8" font-weight="400" fill="#53676e" text-anchor="middle">170,18  bestaand glas</text>
<text x="296" y="47" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" fill="#53676e" text-anchor="start">MATERIAALBASIS</text>
<text x="296" y="53" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" fill="#53676e" text-anchor="start">Bestaand glazen touchfront.</text>
<text x="296" y="59" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" fill="#53676e" text-anchor="start">Berkenmultiplex + walnootfineer.</text>
<text x="296" y="65" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" fill="#53676e" text-anchor="start">Aluminium achterplaat 3 mm.</text>
<text x="296" y="71" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" fill="#53676e" text-anchor="start">Geen metalen voorrand toegevoegd.</text>
<text x="296" y="92" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" fill="#53676e" text-anchor="start">AFGELEIDE PASMAAT</text>
<text x="296" y="98" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" fill="#53676e" text-anchor="start">176 × 110 × 45 mm kast.</text>
<text x="296" y="104" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" fill="#53676e" text-anchor="start">Glasrand → hout: circa 2.9 mm.</text>
<text x="296" y="110" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" fill="#53676e" text-anchor="start">Knop steekt 1,5 mm boven de kast.</text>
<text x="296" y="116" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" fill="#53676e" text-anchor="start">Wandophanging komt daar nog achter.</text>
<text x="296" y="137" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" fill="#53676e" text-anchor="start">SLIM RUIMTEGEBRUIK</text>
<text x="296" y="143" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" fill="#53676e" text-anchor="start">Pi en HAT naast elkaar.</text>
<text x="296" y="149" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" fill="#53676e" text-anchor="start">Sensoren tegen bovenwand.</text>
<text x="296" y="155" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" fill="#53676e" text-anchor="start">Lage delen vóór hoofdprinten.</text>
<text x="296" y="161" font-family="DejaVu Sans, sans-serif" font-size="3.1" font-weight="400" fill="#53676e" text-anchor="start">Sensorstekkers versprongen in diepte.</text>
<text x="296" y="182" font-family="DejaVu Sans, sans-serif" font-size="2.9" font-weight="400" fill="#53676e" text-anchor="start">CONTROLEGRENZEN</text>
<text x="296" y="188" font-family="DejaVu Sans, sans-serif" font-size="2.9" font-weight="400" fill="#53676e" text-anchor="start">Pi is een conservatieve omhullende.</text>
<text x="296" y="194" font-family="DejaVu Sans, sans-serif" font-size="2.9" font-weight="400" fill="#53676e" text-anchor="start">Carrier / klemmen zijn reserveringen.</text>
<text x="296" y="200" font-family="DejaVu Sans, sans-serif" font-size="2.9" font-weight="400" fill="#53676e" text-anchor="start">Kabelloop en bevestiging volgen.</text>
<text x="296" y="206" font-family="DejaVu Sans, sans-serif" font-size="2.9" font-weight="400" fill="#53676e" text-anchor="start">Thermisch en RF nog op hardware testen.</text>
<text x="18" y="243" font-family="DejaVu Sans, sans-serif" font-size="2.9" font-weight="400" fill="#53676e" text-anchor="start">Doorgetrokken: hoofdonderdelen. Gestreept: lage voorste delen / reserveringen. Kijkrichting vanaf het scherm.</text>
<text x="18" y="252" font-family="DejaVu Sans, sans-serif" font-size="2.9" font-weight="400" fill="#53676e" text-anchor="start">PCBs liggen naast elkaar; losse aansluitdelen benutten plaatselijk een andere dieptelaag.</text>
<text x="18" y="261" font-family="DejaVu Sans, sans-serif" font-size="2.9" font-weight="700" fill="#23343a" text-anchor="start">De kastmaat komt uit de sponning en 3D-opstelling; de render levert geen millimeters.</text>
</svg>
