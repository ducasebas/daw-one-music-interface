name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: npm audit --omit=dev --audit-level=high
      - name: Install browsers from the primary Ubuntu package mirror
        if: matrix.node == 24
        run: |
          # Regional runner mirrors can stall the full validation job.
          # Keep Ubuntu signature verification and the complete test matrix.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          if [ -f /etc/apt/apt-mirrors-security.txt ]; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
          fi
          npx playwright install --with-deps chromium webkit
      - run: npm run test:ui -- --max-failures=1
        if: matrix.node == 24
      - run: npm run test:offline -- --max-failures=1
        if: matrix.node == 24
      - run: npx playwright test -c playwright.webkit.config.js wall.spec.js
        if: matrix.node == 24
